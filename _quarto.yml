project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "people/**/*.qmd"
    - "projects/**/*.qmd"
    - "publications/**/*.qmd"
    - "news/index.qmd"
    # Prototype pages remain in source for later integration but are not
    # rendered, indexed, or published with the production website.
    - "!examples/**"
    - "!news/posts/**"
  resources:
    - assets/**

website:
  title: "SEEM · KFUPM"
  site-url: https://seem-kfupm.github.io
  description: "Smart Earth Exploration and Monitoring research at KFUPM"
  draft-mode: gone
  favicon: assets/media/icon.png
  open-graph: true
  twitter-card: true
  search:
    location: navbar
    type: overlay
  navbar:
    logo: assets/media/icon.png
    logo-alt: "SEEM"
    pinned: true
    collapse-below: lg
    left:
      - text: Home
        href: index.qmd
      - text: Research
        href: research.qmd
      - text: People
        href: people/index.qmd
      - text: Publications
        href: publications/index.qmd
      - text: Projects & Software
        menu:
          - text: Public projects
            href: projects/index.qmd
          # Prototype option retained for later integration:
          # - text: Python notebook demo
          #   href: examples/python.qmd
      # The prototype post remains disabled; the News page shows a public
      # placeholder until the first reviewed announcement is available.
      - text: News
        href: news/index.qmd
      - text: Join / Contact
        href: join.qmd
    right:
      - icon: github
        href: https://github.com/SEEM-KFUPM
        aria-label: SEEM on GitHub
  page-footer:
    left: "© 2026 Smart Earth Exploration and Monitoring Group"
    center: |
      <div class="footer-affiliation">
        <a class="footer-affiliation-logo" href="https://cpg.kfupm.edu.sa/" aria-label="College of Petroleum Engineering & Geosciences">
          <img class="footer-logo light-content" src="/assets/media/cpg-logo-black.png" alt="College of Petroleum Engineering & Geosciences">
          <img class="footer-logo dark-content" src="/assets/media/cpg-logo-white.png" alt="">
        </a>
        <p><a href="https://cpg.kfupm.edu.sa/">College of Petroleum Engineering &amp; Geosciences</a> · <a href="https://www.kfupm.edu.sa/">KFUPM</a></p>
      </div>
    right:
      - icon: github
        href: https://github.com/SEEM-KFUPM
        aria-label: SEEM on GitHub

format:
  html:
    page-layout: full
    theme:
      light: [cosmo, styles.scss]
      dark: [cosmo, styles.scss, styles-dark.scss]
    respect-user-color-scheme: true
    toc: true
    link-external-newwindow: true
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    smooth-scroll: true

execute:
  freeze: auto
  warning: false

bibliography: publications.bib
